<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pick &amp; Sort</title>
<meta name="description" content="Turn a file of warehouse orders into a shelf-ordered pick list and a last-to-first unpack list.">
<meta name="theme-color" content="#1f5f8b">
<meta name="claude:viewport-fit-sides" content="cover">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --bg: #f4f5f7; --card: #ffffff; --text: #1b1f24; --muted: #5d6673; --line: #d9dde3;
  --accent: #1f5f8b; --accent-text: #ffffff; --accent-soft: #e3eef6;
  --good: #1e7a46; --good-soft: #e2f4e9; --warn: #9a5b00; --warn-soft: #fff3dc;
  --danger: #b3261e;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171b; --card: #1d2127; --text: #eceff3; --muted: #a2abb7; --line: #343a43;
    --accent: #5aa7dc; --accent-text: #0d1a24; --accent-soft: #1d3446;
    --good: #5fd08f; --good-soft: #17352a; --warn: #f0b45a; --warn-soft: #3a2c14;
    --danger: #ff8a80;
  }
}
:root[data-theme="dark"] {
  --bg: #14171b; --card: #1d2127; --text: #eceff3; --muted: #a2abb7; --line: #343a43;
  --accent: #5aa7dc; --accent-text: #0d1a24; --accent-soft: #1d3446;
  --good: #5fd08f; --good-soft: #17352a; --warn: #f0b45a; --warn-soft: #3a2c14;
  --danger: #ff8a80;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--accent); color: var(--accent-text);
  display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; }
header.top h1 { font-size: 20px; margin: 0; letter-spacing: .2px; }
header.top button { background: transparent; color: inherit; border: 1px solid currentColor; border-radius: 10px;
  padding: 8px 12px; font-size: 15px; cursor: pointer; }
main { max-width: 860px; margin: 0 auto; padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--accent); }
#toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30;
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 15px; max-width: calc(100% - 32px); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
.card h2 { font-size: 18px; margin: 0 0 8px; }
.card h3 { font-size: 16px; margin: 14px 0 6px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
button.btn, label.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px;
  padding: 10px 16px; border-radius: 10px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-text);
  font-size: 16px; font-weight: 600; cursor: pointer; }
button.btn.secondary, label.btn.secondary { background: transparent; color: var(--accent); }
button.btn.small { min-height: 34px; padding: 4px 10px; font-size: 14px; }
button.btn:disabled { opacity: .45; cursor: default; }
button.link { background: none; border: 0; color: var(--accent); padding: 0; font: inherit; text-decoration: underline; cursor: pointer; }
input[type=number], input[type=text], select, textarea { font: inherit; color: var(--text); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 40px; }
input[type=number] { width: 90px; }
textarea { width: 100%; min-height: 140px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; }
.notice { border-radius: 10px; padding: 10px 12px; margin: 10px 0; font-size: 15px; }
.notice.warn { background: var(--warn-soft); color: var(--warn); }
.notice.good { background: var(--good-soft); color: var(--good); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 8px 0 12px; }
.stat { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; }
.stat b { display: block; font-size: 24px; }
.tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); margin-bottom: 12px; overflow-x: auto; }
.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 12px; font: inherit;
  color: var(--muted); cursor: pointer; white-space: nowrap; }
.tabs button.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
table.list { width: 100%; border-collapse: collapse; }
table.list th { text-align: left; font-size: 13px; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.list td { padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.list td.big { font-size: 20px; font-weight: 700; }
tr.unit-head td { background: var(--accent-soft); font-weight: 700; font-size: 14px; }
tr.done td { opacity: .4; text-decoration: line-through; }
tr.last td { background: var(--good-soft); }
.pile { display: inline-block; min-width: 42px; text-align: center; background: var(--accent); color: var(--accent-text);
  border-radius: 8px; padding: 2px 8px; font-size: 20px; font-weight: 800; }
.lastnote { color: var(--good); font-weight: 700; font-size: 14px; }
.iname { font-weight: 700; font-size: 17px; }
.idet { color: var(--muted); font-size: 14px; }
td.box { font-size: 20px; font-weight: 800; white-space: nowrap; }
#stepper .details { font-size: 18px; color: var(--muted); }
.key { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.key div { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: flex; align-items: center; gap: 10px; }
.unit { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 10px 0; }
.unit-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.shelf-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px dashed var(--line); }
.shelf-row .lbl { width: 110px; font-size: 14px; color: var(--muted); }
.walk-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.walk-item span.n { width: 28px; text-align: right; color: var(--muted); }
.walk-item span.name { flex: 1; }
.hidden { display: none !important; }
/* step-through */
#stepper { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: flex; flex-direction: column; }
#stepper .bar { height: 6px; background: var(--line); }
#stepper .bar i { display: block; height: 100%; background: var(--accent); }
#stepper .body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 16px; gap: 6px; }
#stepper .item { font-size: 30px; font-weight: 700; }
#stepper .qty { font-size: 22px; color: var(--muted); }
#stepper .to { font-size: 22px; margin-top: 14px; color: var(--muted); }
#stepper .order { font-size: 110px; font-weight: 900; line-height: 1; color: var(--accent); }
#stepper .done-banner { margin-top: 16px; background: var(--good-soft); color: var(--good); border-radius: 14px; padding: 14px 18px; font-size: 20px; font-weight: 800; }
#stepper .nav { display: flex; gap: 10px; padding: 16px; padding-bottom: max(16px, env(safe-area-inset-bottom)); }
#stepper .nav button { flex: 1; min-height: 64px; font-size: 20px; }
@media print {
  header.top, .no-print, .tabs { display: none !important; }
  body { background: #fff; color: #000; }
  .card { border: 0; padding: 0; }
  .tabpane.hidden { display: block !important; page-break-before: always; }
}
</style>
</head>
<body>
<header class="top">
  <h1 id="title">Pick &amp; Sort</h1>
  <button id="navBtn" type="button" aria-label="Settings">&#9881; Settings</button>
</header>

<main id="homeView">
  <section class="card no-print">
    <h2>1. Add your orders file</h2>
    <p class="muted small">A spreadsheet (Excel or CSV) with one line per item: <b>Order</b>, <b>Box</b> (the shelf number, like 1A), <b>Item</b> (what it is), and optional <b>Details</b> and <b>Qty</b>. Any other columns are shown as details.</p>
    <div class="row">
      <label class="btn">Choose file<input id="fileInput" type="file" accept=".csv,.tsv,.txt,.xlsx,.xls,text/csv" hidden></label>
      <button class="btn secondary" id="pasteToggle" type="button">Paste instead</button>
      <button class="btn secondary" id="exampleBtn" type="button">Try an example</button>
    </div>
    <div id="pasteBox" class="hidden" style="margin-top:12px">
      <textarea id="pasteText" placeholder="Order,Box,Item,Details,Qty&#10;10452,1A,Blue mug,12 oz,1&#10;10452,3B,Notebook,Lined A5,2"></textarea>
      <div class="row" style="margin-top:8px"><button class="btn" id="pasteGo" type="button">Use this</button></div>
    </div>
    <p class="small muted" style="margin-bottom:0">
      <button class="link" id="templateBtn" type="button">Download a blank template</button>
      &nbsp;·&nbsp; File layout:
      <select id="formatSel" aria-label="File layout">
        <option value="auto">Figure it out</option>
        <option value="long">One line per item (Order, Box, Item, Qty)</option>
        <option value="wide">One line per order (Order, box, box, …)</option>
      </select>
    </p>
    <div id="loadMsg"></div>
  </section>

  <section id="results" class="card hidden">
    <h2>2. Your lists</h2>
    <p class="muted small" id="fileName"></p>
    <div class="stats" id="stats"></div>
    <div id="warnings"></div>
    <div class="row no-print" style="margin-bottom:14px">
      <button class="btn" id="pdfPick" type="button">&#11015; Pick list PDF</button>
      <button class="btn" id="pdfUnpack" type="button">&#11015; Unpack list PDF</button>
      <button class="btn secondary" id="stepBtn" type="button">&#9654; Unpack step by step</button>
      <button class="btn secondary" id="printBtn" type="button">Print</button>
    </div>
    <div class="tabs" role="tablist">
      <button data-tab="pick" class="on" type="button">Pick list</button>
      <button data-tab="unpack" type="button">Unpack list</button>
      <button data-tab="key" type="button">Order numbers</button>
    </div>
    <div class="tabpane" id="tab-pick"></div>
    <div class="tabpane hidden" id="tab-unpack"></div>
    <div class="tabpane hidden" id="tab-key"></div>
  </section>
</main>

<main id="settingsView" class="hidden"></main>

<div id="toast" class="hidden" role="status"></div>

<div id="stepper" class="hidden" role="dialog" aria-label="Unpack step by step">
  <div class="bar"><i id="stepBar"></i></div>
  <div class="row" style="justify-content:space-between;padding:12px 16px">
    <span class="muted" id="stepCount"></span>
    <button class="btn secondary small" id="stepClose" type="button">Close</button>
  </div>
  <div class="body" id="stepBody"></div>
  <div class="nav">
    <button class="btn secondary" id="stepPrev" type="button">&#9664; Back</button>
    <button class="btn" id="stepNext" type="button">Next &#9654;</button>
  </div>
</div>

<script>
"use strict";
/* =====================================================================
   CORE LOGIC (no screen code here)
   ===================================================================== */

/** Read CSV / TSV / plain text into rows of cells. */
function parseDelimited(text) {
  text = String(text).replace(/^﻿/, "");
  const firstLine = text.split(/\r?\n/).find(l => l.trim()) || "";
  let delim = null, best = 0;
  for (const c of ["\t", ",", ";", "|"]) {
    const n = firstLine.split(c).length - 1;
    if (n > best) { best = n; delim = c; }
  }
  if (!delim) {
    return text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => l.split(/\s+/));
  }
  const rows = []; let row = [], field = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
      else field += ch;
    } else if (ch === '"') q = true;
    else if (ch === delim) { row.push(field); field = ""; }
    else if (ch === "\n" || ch === "\r") {
      if (ch === "\r" && text[i + 1] === "\n") i++;
      row.push(field); rows.push(row); row = []; field = "";
    } else field += ch;
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  return rows;
}

const clean = v => String(v == null ? "" : v).trim();
/** Box codes: "#01a " -> "1A". Leading zeros and spaces don't matter. */
function normBox(v) {
  return clean(v).replace(/^#\s*/, "").replace(/\s+/g, "").toUpperCase().replace(/\d+/g, d => String(parseInt(d, 10)));
}
const natural = (a, b) => String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: "base" });

/**
 * Expand a shelf's box list, left to right.
 * "1A-10A" -> 1A,2A..10A   "A1-A5" -> A1..A5   "1-25" -> 1..25   "1A, 3A, 7C" -> as written
 */
function expandBoxes(text) {
  const out = [], errors = [];
  String(text || "").split(/[,;\n]+/).map(t => t.trim()).filter(Boolean).forEach(part => {
    const m = part.replace(/\s+/g, "").toUpperCase().match(/^([A-Z]*)(\d+)([A-Z]*)(?:-|–|TO)([A-Z]*)(\d+)([A-Z]*)$/);
    if (m && m[1] === m[4] && m[3] === m[6]) {
      const a = parseInt(m[2], 10), b = parseInt(m[5], 10), step = b >= a ? 1 : -1;
      if (Math.abs(b - a) > 5000) { errors.push(`"${part}" is too long a range.`); return; }
      for (let n = a; ; n += step) { out.push(`${m[1]}${n}${m[3]}`); if (n === b) break; }
    } else if (m) {
      errors.push(`"${part}": both ends of a range need the same letters (like 1A-10A).`);
    } else out.push(normBox(part));
  });
  return { boxes: out, errors };
}

function findHeader(row) {
  const c = row.map(x => clean(x).toLowerCase());
  const used = new Set();
  const pick = re => { const i = c.findIndex((x, j) => !used.has(j) && x && re.test(x)); if (i >= 0) used.add(i); return i; };
  const oi = pick(/order|invoice|ticket|^po\b|customer/);
  if (oi < 0) return null;
  const qi = pick(/qty|quant|amount|count|units|pcs|how many/);
  let bi = pick(/box|bin|loc|slot|position|shelf|number|^no\.?$|^#$|code|sku/);
  let ni = pick(/name|desc|product|item|title|article/);
  if (bi < 0 && ni >= 0) { bi = ni; ni = -1; } // only one item column: it's the box
  if (bi < 0) return null;
  const di = c.map((x, i) => (!used.has(i) && x ? i : -1)).filter(i => i >= 0);
  return { oi, qi, bi, ni, di, labels: row.map(clean) };
}

/** Turn rows into order lines: [{order, box, name, details, qty}] */
function rowsToLines(rows, format) {
  rows = rows.map(r => r.map(clean)).filter(r => r.some(Boolean));
  const warnings = [];
  if (!rows.length) return { lines: [], warnings: ["The file looks empty."] };
  const header = findHeader(rows[0]);
  const body = header ? rows.slice(1) : rows;
  let mode = format;
  if (mode === "auto") mode = !header && Math.max(...rows.map(r => r.filter(Boolean).length)) > 3 ? "wide" : "long";
  const oi = header ? header.oi : 0;
  const lines = [];
  let lastOrder = "";
  const lineNo = idx => idx + (header ? 2 : 1);
  body.forEach((r, idx) => {
    let order = r[oi] || lastOrder; // blank order cell = same order as the line above
    if (!order) { warnings.push(`Line ${lineNo(idx)}: no order number, skipped.`); return; }
    lastOrder = order;
    if (mode === "wide") {
      r.forEach((cell, i) => {
        if (i === oi || !cell) return;
        const m = cell.match(/^(.+?)\s*[x×*]\s*(\d+)$/i);
        lines.push({ order, box: normBox(m ? m[1] : cell), name: "", details: "", qty: m ? parseInt(m[2], 10) : 1 });
      });
      return;
    }
    const bi = header ? header.bi : 1, qi = header ? header.qi : 2;
    const box = normBox(r[bi]);
    if (!box) { warnings.push(`Line ${lineNo(idx)} (order ${order}): no box number, skipped.`); return; }
    let qty = 1;
    if (qi >= 0 && r[qi] !== undefined && r[qi] !== "") {
      qty = parseInt(String(r[qi]).replace(/[^\d]/g, ""), 10);
      if (!(qty >= 0)) { warnings.push(`Line ${lineNo(idx)}: quantity "${r[qi]}" isn't a number, used 1.`); qty = 1; }
    }
    const name = header && header.ni >= 0 ? r[header.ni] || "" : "";
    const details = header ? header.di.filter(i => r[i])
      .map(i => /detail|note|desc|info|comment|variant|option|extra/i.test(header.labels[i]) ? r[i] : `${header.labels[i]}: ${r[i]}`).join(" · ") : "";
    if (qty > 0) lines.push({ order, box, name, details, qty });
  });
  return { lines, warnings, mode };
}

/** Map every box code to its place in the walk. Returns {locate, problems, size}. */
function buildLocator(settings) {
  const map = new Map(), problems = [];
  const walkIndex = new Map(settings.walk.map((id, i) => [id, i]));
  settings.units.forEach(u => {
    const wi = walkIndex.has(u.id) ? walkIndex.get(u.id) : 9999;
    const S = u.shelves.length;
    const block = Math.max(1, parseInt(u.block, 10) || 5);
    u.shelves.forEach((sh, s) => {
      const { boxes, errors } = expandBoxes(sh.boxes);
      errors.forEach(e => problems.push(`${u.name}, shelf ${s + 1}: ${e}`));
      const L = boxes.length;
      boxes.forEach((code, p) => {
        if (map.has(code)) { const o = map.get(code); problems.push(`Box ${code} is on both "${o.unitName}" shelf ${o.shelf} and "${u.name}" shelf ${s + 1}.`); return; }
        const x = u.dir === "rtl" ? L - 1 - p : p;
        let k;
        switch (u.pattern) {
          case "rows-up": k = [S - 1 - s, x]; break;
          case "columns": k = [x, s]; break;
          case "blocks": k = [Math.floor(x / block), s, x]; break;
          default: k = [s, x]; // rows-down
        }
        map.set(code, { unitId: u.id, unitName: u.name, shelf: s + 1, shelves: S, pos: p + 1, key: [wi, ...k] });
      });
    });
  });
  if (problems.length > 6) problems.splice(6, problems.length - 6, "…and more.");
  return { locate: code => map.get(normBox(code)) || null, problems, size: map.size };
}

function compareKeys(a, b) {
  for (let i = 0; i < Math.max(a.length, b.length); i++) {
    const d = (a[i] ?? -1) - (b[i] ?? -1);
    if (d) return d;
  }
  return 0;
}

/** The whole plan: pick list (shelf order) + unpack list (last picked first). */
function makePlan(lines, settings) {
  const { locate } = buildLocator(settings);
  const orders = new Map();
  lines.forEach(l => {
    if (!orders.has(l.order)) orders.set(l.order, { raw: l.order, units: 0, things: new Map() });
    const o = orders.get(l.order);
    o.units += l.qty;
    const k = `${l.box}\u0000${l.name}\u0000${l.details}`;
    if (!o.things.has(k)) o.things.set(k, { box: l.box, name: l.name, details: l.details, qty: 0 });
    o.things.get(k).qty += l.qty;
  });
  const orderList = [...orders.values()];
  if (settings.orderNumbering !== "file") orderList.sort((a, b) => natural(a.raw, b.raw));
  orderList.forEach((o, i) => { o.label = i + 1; });

  // One pick line per box + item (a box can hold more than one kind of item)
  const picks = new Map();
  orderList.forEach(o => o.things.forEach((t, k) => {
    if (!picks.has(k)) picks.set(k, { box: t.box, name: t.name, details: t.details, qty: 0, orders: [], loc: locate(t.box) });
    const p = picks.get(k);
    p.qty += t.qty;
    p.orders.push({ label: o.label, raw: o.raw, qty: t.qty });
  }));
  const list = [...picks.values()];
  list.sort((a, b) => {
    if (a.loc && b.loc) { const d = compareKeys(a.loc.key, b.loc.key); if (d) return d; }
    else if (a.loc) return -1;
    else if (b.loc) return 1;
    else { const d = natural(a.box, b.box); if (d) return d; }
    return natural(a.name, b.name) || natural(a.details, b.details);
  });
  list.forEach((p, i) => { p.step = i + 1; });

  // Unpack: top of the cart = last picked
  const left = new Map(orderList.map(o => [o.label, o.units]));
  const unpack = [];
  [...list].reverse().forEach(p => {
    p.orders.forEach(o => {
      left.set(o.label, left.get(o.label) - o.qty);
      unpack.push({ box: p.box, name: p.name, details: p.details, qty: o.qty, label: o.label, raw: o.raw, last: left.get(o.label) === 0 });
    });
  });
  unpack.forEach((u, i) => { u.step = i + 1; });

  const unknown = [...new Set(list.filter(p => !p.loc).map(p => p.box))];
  return { orders: orderList, picks: list, unpack, unknown, totalUnits: list.reduce((s, p) => s + p.qty, 0) };
}
/** What to call an item when the box number isn't shown. */
const itemName = t => t.name || `Item from box ${t.box}`;

/* ---------- settings ---------- */
let nextId = 1;
/**
 * Quick-setup map. shelvesPer: a number, or a list (one per unit).
 * letters=true: every shelf of a unit shares box numbers, with a shelf letter (top = A): 1A..10A, 1B..10B.
 * letters=false: numbers just keep counting: 1..10, 11..20.
 */
function makeUnits(shelvesPer, perShelf, firstNumber, letters) {
  const units = []; let n = firstNumber;
  shelvesPer.forEach((count, u) => {
    const shelves = [];
    for (let s = 0; s < count; s++) {
      if (letters) { const L = String.fromCharCode(65 + (s % 26)); shelves.push({ boxes: `${n}${L}-${n + perShelf - 1}${L}` }); }
      else { shelves.push({ boxes: `${n}-${n + perShelf - 1}` }); n += perShelf; }
    }
    if (letters) n += perShelf;
    units.push({ id: nextId++, name: `Unit ${u + 1}`, shelves, pattern: "rows-down", block: 5, dir: "ltr" });
  });
  return units;
}
/** Suggest the next shelf below, from the one above: 1A-10A -> 1B-10B; 1-25 -> 26-50. */
function guessNextShelf(text) {
  const m = String(text || "").replace(/\s+/g, "").toUpperCase().match(/^([A-Z]*)(\d+)([A-Z]?)-([A-Z]*)(\d+)([A-Z]?)$/);
  if (!m) return "";
  const a = +m[2], b = +m[5];
  if (m[3] && m[3] === m[6] && m[3] !== "Z") { const L = String.fromCharCode(m[3].charCodeAt(0) + 1); return `${m[1]}${a}${L}-${m[4]}${b}${L}`; }
  if (!m[3] && !m[6]) return `${m[1]}${b + 1}-${m[4]}${b + 1 + (b - a)}`;
  return "";
}
function defaultSettings() {
  const units = makeUnits([3, 2, 4, 3], 10, 1, true);
  return { version: 2, units, walk: units.map(u => u.id), orderNumbering: "sorted", theme: "auto" };
}
function fixSettings(s) {
  if (!s || !Array.isArray(s.units)) return defaultSettings();
  s.units.forEach(u => {
    if (!u.id) u.id = nextId++;
    nextId = Math.max(nextId, u.id + 1);
    u.shelves = (u.shelves || []).map(sh => sh.boxes !== undefined ? sh
      : { boxes: sh.start === sh.end ? `${sh.start ?? ""}` : `${sh.start ?? ""}-${sh.end ?? ""}` }); // old number ranges
    u.pattern = u.pattern || "rows-down"; u.dir = u.dir || "ltr"; u.block = u.block || 5;
  });
  const ids = new Set(s.units.map(u => u.id));
  s.walk = (s.walk || []).filter(id => ids.has(id));
  s.units.forEach(u => { if (!s.walk.includes(u.id)) s.walk.push(u.id); });
  s.orderNumbering = s.orderNumbering || "sorted";
  s.theme = s.theme || "auto";
  s.version = 2;
  return s;
}

}

function pickPdf() {
  const doc = newDoc(); if (!doc) return;

function renderSettings() {
  const v = $("settingsView");
  const qIn = (key, attrs) => h("input", Object.assign({ value: quick[key], oninput: e => { quick[key] = e.target.type === "number" ? +e.target.value : e.target.value; } }, attrs));
  v.replaceChildren(
    h("section", { class: "card" },
      h("h2", null, "Quick setup"),
      h("p", { class: "small muted" }, "Builds a starting map. You can change any shelf afterwards."),
      h("div", { class: "row" },
        h("label", null, "Shelving units ", qIn("units", { type: "number", min: 1, id: "qUnits" })),
        h("label", null, "Boxes per shelf ", qIn("per", { type: "number", min: 1, id: "qPer" })),
        h("label", null, "First number ", qIn("first", { type: "number", id: "qFirst" }))),
      h("label", { style: "display:block;margin-top:10px" }, "Shelves on each unit ",
        qIn("shelves", { type: "text", id: "qShelves", style: "width:160px" }),
        h("div", { class: "small muted" }, "One number if they're all the same (4), or one per unit, top to bottom of the walking order (3, 2, 4).")),
      h("div", { style: "margin-top:10px" },
        h("label", { style: "display:block;padding:4px 0" }, h("input", { type: "radio", name: "qlet", checked: quick.letters, onchange: () => { quick.letters = true; } }),
          " Shelf letters: top shelf A, next B… (1A 2A 3A on top, 1B 2B 3B below)"),
        h("label", { style: "display:block;padding:4px 0" }, h("input", { type: "radio", name: "qlet", checked: !quick.letters, onchange: () => { quick.letters = false; } }),
          " Plain numbers that keep counting (1–10 on top, 11–20 below)")),
      h("div", { class: "row", style: "margin-top:10px" },
        h("button", { class: "btn", type: "button", onclick: e => tapTwice(e.currentTarget, "Replace your whole map?", () => {
          const n = Math.max(1, quick.units | 0);
          const list = String(quick.shelves).split(/[^\d]+/).filter(Boolean).map(x => Math.max(1, parseInt(x, 10)));
          const shelvesPer = Array.from({ length: n }, (_, i) => list.length ? (list[i] ?? list[list.length - 1]) : 4);
          settings.units = makeUnits(shelvesPer, Math.max(1, quick.per | 0), quick.first | 0, quick.letters);
          settings.walk = settings.units.map(u => u.id); changed(true); toast("Map built.");
        }) }, "Build this map"))),
    h("section", { class: "card" },
      h("h2", null, "Your shelving units"),
      h("p", { class: "small muted" }, "For each shelf, type its boxes from left to right. Shelf 1 is the top shelf. Use a dash for a run (1A-10A or 1-25), or list them with commas (1A, 2A, 5A). Then choose how to walk that unit."),
      h("div", { id: "checks" }),
      settings.units.map((u, ui) => unitCard(u, ui)),
      h("button", { class: "btn secondary", type: "button", onclick: () => {
        const last = settings.units[settings.units.length - 1];
        const shelves = last ? last.shelves.map(() => ({ boxes: "" })) : [{ boxes: "" }];
        const nu = { id: nextId++, name: `Unit ${settings.units.length + 1}`, shelves, pattern: "rows-down", block: 5, dir: "ltr" };
        settings.units.push(nu); settings.walk.push(nu.id); changed(true);
      } }, "+ Add a shelving unit")),
    h("section", { class: "card" },
      h("h2", null, "Walking order"),
      h("p", { class: "small muted" }, "Which unit you visit first, second, third… Use the arrows to change it."),
      settings.walk.map((id, i) => {
        const u = settings.units.find(x => x.id === id);
        return h("div", { class: "walk-item" }, h("span", { class: "n" }, `${i + 1}.`), h("span", { class: "name" }, u.name),
          h("button", { class: "btn secondary small", type: "button", disabled: i === 0, "aria-label": "Move up", onclick: () => { [settings.walk[i - 1], settings.walk[i]] = [settings.walk[i], settings.walk[i - 1]]; changed(true); } }, "▲"),
          h("button", { class: "btn secondary small", type: "button", disabled: i === settings.walk.length - 1, "aria-label": "Move down", onclick: () => { [settings.walk[i + 1], settings.walk[i]] = [settings.walk[i], settings.walk[i + 1]]; changed(true); } }, "▼"));
      })),
    h("section", { class: "card" },
      h("h2", null, "Order numbers"),
      h("p", { class: "small muted" }, "Long order numbers get swapped for short ones: 1, 2, 3…"),
      ["sorted", "file"].map(val => h("label", { style: "display:block;padding:6px 0" },
        h("input", { type: "radio", name: "onum", checked: settings.orderNumbering === val, onchange: () => { settings.orderNumbering = val; changed(false); } }),
        val === "sorted" ? " Lowest order number becomes 1" : " First order in the file becomes 1"))),
    h("section", { class: "card" },
      h("h2", null, "Find a box"),
      h("p", { class: "small muted" }, "Type a box number to see where your map puts it."),
      h("div", { class: "row" }, h("input", { type: "text", id: "probe", placeholder: "e.g. 12B", style: "width:120px", oninput: renderChecks }), h("span", { id: "probeOut" }))),
    h("section", { class: "card" },
      h("h2", null, "Backup & other devices"),
      h("p", { class: "small muted" }, "Settings are saved on this device only. Save them to a file to copy them to another phone, tablet or computer."),
      h("div", { class: "row" },
        h("button", { class: "btn secondary", type: "button", onclick: () => download(new Blob([JSON.stringify(settings, null, 2)], { type: "application/json" }), "pick-and-sort-settings.json") }, "Save settings file"),
        h("label", { class: "btn secondary" }, "Load settings file", h("input", { type: "file", accept: ".json,application/json", hidden: true, onchange: async e => {
          const f = e.target.files[0]; if (!f) return;
          try { settings = fixSettings(JSON.parse(await f.text())); changed(true); toast("Settings loaded."); } catch (err) { toast("That isn't a settings file."); }
        } })),
        h("button", { class: "btn secondary", type: "button", onclick: e => tapTwice(e.currentTarget, "Start over?", () => { settings = defaultSettings(); changed(true); toast("Settings reset."); }) }, "Reset")),
      h("p", { class: "small muted" }, "Look: ",
        h("select", { onchange: e => { settings.theme = e.target.value; applyTheme(); saveSettings(); } },
          [["auto", "Match device"], ["light", "Light"], ["dark", "Dark"]].map(([val, t]) => h("option", { value: val, selected: settings.theme === val }, t))))));
  renderChecks();
}

function unitCard(u, ui) {
  return h("div", { class: "unit" },
    h("div", { class: "unit-top" },
      h("input", { type: "text", value: u.name, "aria-label": "Unit name", style: "font-weight:700;max-width:220px",
        onchange: e => { u.name = e.target.value.trim() || `Unit ${ui + 1}`; changed(true); } }),
      h("span", { class: "small muted" }, `${u.shelves.length} shelf${u.shelves.length === 1 ? "" : "s"}`),
      h("button", { class: "btn secondary small", type: "button", onclick: e => tapTwice(e.currentTarget, "Delete?", () => {
        settings.units.splice(ui, 1); settings.walk = settings.walk.filter(id => id !== u.id); changed(true);
      }) }, "Delete unit")),
    h("div", { class: "row", style: "margin:10px 0" },
      h("select", { "aria-label": "How to walk this unit", onchange: e => { u.pattern = e.target.value; changed(true); } },
        PATTERNS.map(([val, t]) => h("option", { value: val, selected: u.pattern === val }, t))),
      u.pattern === "blocks" ? h("label", null, "boxes per section ", numInput(u.block, x => u.block = x)) : null,
      h("select", { "aria-label": "Direction", onchange: e => { u.dir = e.target.value; changed(false); } },
        [["ltr", "Left to right"], ["rtl", "Right to left"]].map(([val, t]) => h("option", { value: val, selected: u.dir === val }, t)))),
    u.shelves.map((s, si) => {
      const count = h("span", { class: "small muted" });
      const showCount = () => { const r = expandBoxes(s.boxes); count.textContent = r.errors.length ? "check this" : `${r.boxes.length} box${r.boxes.length === 1 ? "" : "es"}`; };
      showCount();
      return h("div", { class: "shelf-row" },
        h("span", { class: "lbl" }, si === 0 ? "Shelf 1 (top)" : si === u.shelves.length - 1 ? `Shelf ${si + 1} (bottom)` : `Shelf ${si + 1}`),
        h("input", { type: "text", value: s.boxes, placeholder: "1A-10A", "aria-label": `Boxes on shelf ${si + 1}`, style: "flex:1;min-width:140px",
          oninput: e => { s.boxes = e.target.value; showCount(); changed(false); } }),
        count,
        h("button", { class: "btn secondary small", type: "button", "aria-label": "Remove shelf", onclick: () => { u.shelves.splice(si, 1); changed(true); } }, "✕"));
    }),
    h("button", { class: "btn secondary small", type: "button", style: "margin-top:6px", onclick: () => {
      const last = u.shelves[u.shelves.length - 1];
      u.shelves.push({ boxes: last ? guessNextShelf(last.boxes) : "" }); changed(true);
    } }, "+ Add shelf at the bottom"));
}

function renderChecks() {
  const loc = buildLocator(settings);
  const box = $("checks");
  if (box) box.replaceChildren(loc.problems.length
    ? h("div", { class: "notice warn" }, "Check these: ", loc.problems.join(" "))
    : h("div", { class: "notice good" }, `Map has ${loc.size} boxes.`));
  const p = $("probe");
  if (p && p.value.trim()) {
    const l = loc.locate(p.value);
    $("probeOut").textContent = l ? `${l.unitName}, shelf ${l.shelf} of ${l.shelves}, box ${l.pos} from the left` : "Not on the map";
  } else if ($("probeOut")) $("probeOut").textContent = "";
}

applyTheme();
</script>
</body>
</html>
