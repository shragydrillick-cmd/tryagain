# Pick & Sort: every change to warehouse-picker/ rebuilds all three versions.
#
#  ios      Builds the iPhone/iPad app on a Mac, runs an automatic check in the
#           iPhone simulator, and makes PickAndSort-unsigned.ipa.
#  android  Builds the Android app. If the signing key is saved in this repo's
#           secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD), the APK is
#           signed with it, so phones accept it as an update.
#  website  Builds the installable website with the newest Android app and
#           publishes it to the gh-pages branch (GitHub Pages) without waiting
#           for the iPhone build, which can sit in GitHub's queue for a Mac.
#  ios-file Adds the newest iPhone file to the published website once the
#           iPhone build has passed.
name: Pick & Sort apps

on:
  push:
    paths:
      - "warehouse-picker/**"
      - ".github/workflows/pick-and-sort-apps.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer change cancels an older build that's still running or waiting.
concurrency:
  group: pick-and-sort-${{ github.ref }}
  cancel-in-progress: true

env:
  # Each build gets a higher version number than the last.
  VERSION_CODE: ${{ github.run_number }}
  VERSION_NAME: 1.${{ github.run_number }}

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: warehouse-picker/ios
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Copy the page into the app
        run: ./prepare-web.sh

      - name: Create the Xcode project
        run: xcodegen generate

      - name: Build for iPhone (unsigned)
        run: |
          xcodebuild -project PickAndSort.xcodeproj -scheme PickAndSort -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            MARKETING_VERSION="$VERSION_NAME" CURRENT_PROJECT_VERSION="$VERSION_CODE" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -n 30
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PickAndSort.app Payload/
          zip -qry PickAndSort-unsigned.ipa Payload
          ls -la PickAndSort-unsigned.ipa

      - name: Build for the iPhone simulator
        run: |
          xcodebuild -project PickAndSort.xcodeproj -scheme PickAndSort -configuration Debug \
            -sdk iphonesimulator -derivedDataPath simbuild CODE_SIGNING_ALLOWED=NO build | tail -n 5

      - name: Run the automatic check in the simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          print(next(x['udid'] for k, v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "Simulator: $DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" simbuild/Build/Products/Debug-iphonesimulator/PickAndSort.app
          sleep 20 # let the simulator finish starting up before opening the app
          # Open the app with its self-test; if it doesn't answer, try again (up to 3 times).
          for attempt in 1 2 3; do
            echo "Attempt $attempt"
            xcrun simctl terminate "$DEVICE" com.picksort.app 2>/dev/null || true
            xcrun simctl launch --console-pty "$DEVICE" com.picksort.app -selftest > console.log 2>&1 &
            PID=$!
            for i in $(seq 1 60); do grep -q "SELFTEST PDF OK\|SELFTEST PDF FAIL\|SELFTEST FAIL" console.log && break; sleep 2; done
            sleep 4
            kill $PID 2>/dev/null || true
            grep -q "SELFTEST OK\|SELFTEST FAIL" console.log && break
            echo "No answer yet:"; cat console.log
            sleep 15
          done
          xcrun simctl io "$DEVICE" screenshot simulator.png || true
          echo "----- app output -----"; grep SELFTEST console.log || cat console.log
          grep -q "SELFTEST OK" console.log
          grep -q "SELFTEST-FILE pick-list" console.log
          grep -q "SELFTEST-FILE unpack-list" console.log
          grep -q "SELFTEST-SETTINGS" console.log
          grep -q "SELFTEST PDF OK" console.log # a packing slip read with Safari's engine on the iPhone

      - uses: actions/upload-artifact@v4
        with:
          name: PickAndSort-iOS-unsigned
          path: warehouse-picker/ios/PickAndSort-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS-simulator-screenshot
          path: warehouse-picker/ios/simulator.png
          if-no-files-found: ignore

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: warehouse-picker/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Use the signing key (if it's saved in the repo's secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::No signing key in secrets: building an unsigned APK, which won't be published."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pick-and-sort.jks"
          {
            echo "storeFile=$RUNNER_TEMP/pick-and-sort.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=picksort"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties

      - name: Build the APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Check the signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ -f keystore.properties ]; then
            BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)
            "${BT}apksigner" verify --print-certs "$APK" | head -n 3
            mkdir -p out && cp "$APK" out/PickAndSort.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: PickAndSort-Android
          path: warehouse-picker/android/out/PickAndSort.apk
          if-no-files-found: ignore

  website:
    needs: [android]
    # Publish only from the main working branches.
    if: github.ref_name == github.event.repository.default_branch || github.ref_name == 'claude/warehouse-picking-app-6rf4zq'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: { group: pick-and-sort-publish, cancel-in-progress: false }
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build the website
        run: sh warehouse-picker/web/build.sh

      - name: Keep the iPhone file that's already published (a new one is added when its build passes)
        run: |
          git fetch -q origin gh-pages || exit 0
          git show origin/gh-pages:PickAndSort-unsigned.ipa > warehouse-picker/web/dist/PickAndSort-unsigned.ipa 2>/dev/null || rm -f warehouse-picker/web/dist/PickAndSort-unsigned.ipa

      - uses: actions/download-artifact@v4
        continue-on-error: true # there's no APK when the signing key isn't set up
        with:
          name: PickAndSort-Android
          path: warehouse-picker/web/dist

      - name: Use the last signed APK if this build couldn't sign one
        run: |
          if [ ! -f warehouse-picker/web/dist/PickAndSort.apk ] && [ -f warehouse-picker/downloads/PickAndSort.apk ]; then
            cp warehouse-picker/downloads/PickAndSort.apk warehouse-picker/web/dist/PickAndSort.apk
          fi

      - name: Publish to the gh-pages branch
        working-directory: warehouse-picker/web/dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .nojekyll
          echo "version $VERSION_NAME, built $(date -u +%Y-%m-%dT%H:%MZ) from ${GITHUB_SHA::7}" > version.txt
          ls -la
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publish Pick & Sort $VERSION_NAME (${GITHUB_SHA::7})"
          git push -f -q "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Published. Once GitHub Pages is switched on (Settings > Pages > gh-pages), it's at https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"

  ios-file:
    needs: [ios, website]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: { group: pick-and-sort-publish, cancel-in-progress: false }
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PickAndSort-iOS-unsigned
          path: ipa

      - name: Add the iPhone file to the published website
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone -q --depth 1 --branch gh-pages "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site
          cp ipa/PickAndSort-unsigned.ipa site/
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PickAndSort-unsigned.ipa
          git commit -qm "Add iPhone file $VERSION_NAME (${GITHUB_SHA::7})" || { echo "No change"; exit 0; }
          git push -q origin gh-pages
